name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Nothing in this workflow writes to the repository: it runs tests, a claim
# verifier and a build. An L6 review 2026-09-11 pointed out that without this
# block the token falls back to whatever the repository default happens to be,
# which is a wider grant than any job here has a use for.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install the package and its dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run the suite
      run: pytest -q

  claims:
    # The 130 checks in verify_claims.sh are what bind every number in the
    # README and the docs to a real run. Until this job existed they were only
    # ever run by hand, on one machine -- so a claim could drift out of true
    # for as long as nobody happened to run the script.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install the package and its dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Verify every documented claim
      run: bash scripts/verify_claims.sh

  clean-install:
    # README claims the suite passes in a fresh environment with nothing else
    # in it. This is the job that shows it, rather than asking to be believed.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Build the empty environment and run the suite inside it
      run: bash scripts/verify_clean_install.sh

  package:
    # A wheel that does not build, or metadata a index would reject, is found
    # at release time otherwise -- after the tag is already pushed.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Build and check the distribution
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*
    - name: Run the suite against the built wheel
      # Every other job installs with `pip install -e .`, so all four of them
      # import the package straight out of the working tree. A file left out of
      # the wheel is invisible to an editable install by construction -- it
      # would ship broken and every job would still be green. An import check
      # alone does not close that: it loads __init__ and nothing else.
      #
      # The suite is copied out of the checkout first, deliberately. Run from
      # the repository root, the `axiomgate_kernel/` directory sitting there
      # shadows the installed package and the tests would measure the working
      # tree again -- the very thing this job exists to avoid. examples/ and
      # scripts/ come along because the suite imports examples/_setup.py;
      # pyproject.toml comes along because without it pytest finds no config
      # here and empty_parameter_set_mark stops applying, which is the one
      # guard this job most needs.
      #
      # test_no_embedded_identity.py is excluded because it reads the *source
      # tree*: it parametrises over the .py files in axiomgate_kernel/, which a
      # wheel does not carry. Pointed at this directory its parameter set comes
      # out empty -- 54 tests silently became 6, two of them skipped, and the
      # run still reported green. That is why it is named here instead of being
      # left to disappear on its own. It is a repository check, not a packaging
      # check, and the test, claims and clean-install jobs all run it in full.
      run: |
        python -m venv /tmp/wheeltest
        /tmp/wheeltest/bin/pip install dist/*.whl pytest
        mkdir -p /tmp/wheelsuite
        cp -r tests examples scripts pyproject.toml /tmp/wheelsuite/
        cd /tmp/wheelsuite
        /tmp/wheeltest/bin/python -c "import axiomgate_kernel, pathlib; print('installed from', pathlib.Path(axiomgate_kernel.__file__).parent)"
        /tmp/wheeltest/bin/python -m pytest tests -q \
          --ignore=tests/test_no_embedded_identity.py
