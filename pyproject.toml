[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomgate-kernel"
version = "0.9.0"
description = "AxiomGate Kernel — deterministic, fail-closed authorization and audit for AI agents"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Robin Svensson", email = "228113985+robin-svensson@users.noreply.github.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["axiomgate_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A parametrised test whose parameter set comes out empty is skipped by
# default, and a skip reads as green. test_no_embedded_identity.py builds its
# parameters by listing the source files on disk -- so pointed at a tree
# without them it examined nothing at all and still passed. Found 2026-09-11
# while building the wheel job. Anything that ends up with nothing to check
# now fails instead of quietly disappearing.
empty_parameter_set_mark = "fail_at_collect"
